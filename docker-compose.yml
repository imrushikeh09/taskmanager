# ==============================================================================
# Task Manager - Production-Grade Multi-Container Docker Compose Stack
# ==============================================================================
# Services:
#   1. nginx:          Reverse proxy, load balancer, and zero-copy static asset server
#   2. web:            Django REST API served via Gunicorn WSGI (Scalable cluster)
#   3. celery_worker:  Asynchronous notification task worker
#   4. postgres:       PostgreSQL 16 relational database with persistent volume
#   5. redis:          Redis 7 in-memory cache & Celery message broker
# ==============================================================================

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: taskmanager_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      web:
        condition: service_started
    networks:
      - taskmanager_network

  postgres:
    image: postgres:16-alpine
    container_name: taskmanager_postgres
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: taskmanager_db
      POSTGRES_USER: taskmanager_user
      POSTGRES_PASSWORD: user@123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Forward container 5432 to host 5433 to avoid collision with any local host PostgreSQL running on 5432
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmanager_user -d taskmanager_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - taskmanager_network

  redis:
    image: redis:7-alpine
    container_name: taskmanager_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      # Forward container 6379 to host 6380 to avoid collision with any local host Redis running on 6379
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - taskmanager_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: taskmanager:latest
    restart: unless-stopped
    env_file:
      - .env.docker
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    networks:
      - taskmanager_network

  celery_worker:
    image: taskmanager:latest
    container_name: taskmanager_celery
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      AUTO_MIGRATE: "false"
      COLLECT_STATIC: "false"
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=2"]
    volumes:
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - taskmanager_network

volumes:
  postgres_data:
    name: taskmanager_postgres_data
  redis_data:
    name: taskmanager_redis_data
  static_data:
    name: taskmanager_static_data
  media_data:
    name: taskmanager_media_data

networks:
  taskmanager_network:
    name: taskmanager_network
    driver: bridge
