# ==============================================================================
# Task Manager Enterprise Nginx Reverse Proxy & Load Balancer Configuration
# ==============================================================================

upstream web_cluster {
    # Distribute requests to whichever Django worker has the fewest active connections
    least_conn;
    server web:8000;
}

server {
    listen 80;
    server_name localhost 127.0.0.1;

    # Maximum allowed payload size (supports 10MB attachments + metadata overhead)
    client_max_body_size 15M;

    # Performance: Kernel zero-copy file streaming
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip Dynamic Compression for API payloads and static assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    # 1. Static Asset Offloading (Served directly from disk without touching Python)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # 2. User-Uploaded Media Files Offloading (Direct disk streaming)
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # 3. Dynamic API & Application Proxy (Gunicorn Cluster)
    location / {
        proxy_pass http://web_cluster;

        # Standard Forwarding Headers for Django Security, Throttling & Tracing
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Request buffering (Slowloris attack mitigation)
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Proxy timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
