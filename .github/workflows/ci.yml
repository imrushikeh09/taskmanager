name: Task Manager Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Stage 1: Backend Quality, Security & Automated Test Suite
  # ============================================================================
  backend-ci:
    name: Backend Tests & Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskmanager_test_db
          POSTGRES_USER: taskmanager_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django System & Deployment Security Audit
        run: |
          python manage.py check --settings=config.settings.testing

      - name: Execute Automated Test Suite (79 Tests)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: taskmanager_test_db
          DB_USER: taskmanager_user
          DB_PASSWORD: test_password
          REDIS_URL: redis://127.0.0.1:6379/1
          CELERY_BROKER_URL: redis://127.0.0.1:6379/0
        run: |
          python manage.py test --settings=config.settings.testing -v 2

  # ============================================================================
  # Stage 2: Frontend Quality & Production Bundle Build
  # ============================================================================
  frontend-ci:
    name: Frontend Build & Compilation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Compile Production Bundle (Vite Build)
        working-directory: frontend
        run: npm run build

  # ============================================================================
  # Stage 3: Multi-Stage Docker Container Verification
  # ============================================================================
  docker-build:
    name: Multi-Stage Docker Image Build
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Cache Docker Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: taskmanager:ci-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Container Least Privilege (Non-Root User)
        run: |
          USER_CHECK=$(docker run --rm taskmanager:ci-latest whoami)
          echo "Container runtime user: $USER_CHECK"
          if [ "$USER_CHECK" != "appuser" ]; then
            echo "SECURITY VIOLATION: Container must run as 'appuser', got '$USER_CHECK'"
            exit 1
          fi

      - name: Verify Startup Self-Check Inside Container
        run: |
          docker run --rm \
            -e DJANGO_SECRET_KEY="ci-validation-secret-key" \
            taskmanager:ci-latest python manage.py check
